<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Kernow Surfing</title>
</head>

<body>
    <h1>Kernow Surfing</h1>
    <h3>Proper surfer boys</h3>

<!-- THE BUTTONS -->
    <div> 
        <div class="card" onmouseover="hoverGroup()" onmouseout="clearDesc()">Group - £35 PP</div>
        <div class="card" onmouseover="hoverPrivate()" onmouseout="clearDesc()">Private - £65 PP</div>
        <div class="card" onmouseover="hoverFamily()" onmouseout="clearDesc()">Family - £30 PP</div>
    </div>

    <p id="desc">Please hover over a button to show more information.</p>

<!-- THE INPUT FORM -->
    <form id="details2">
        <div id="left">
            <label for="fullname">Full Name:</label><br><br>
            <label for="lesson">Lesson:</label><br><br>
            <label for="people">People:</label>
        </div>
        <div id="right">
            <input type="search" placeholder="Full Name" id="fullName"><br><br>
            <select name="lessons" id="lessons">
                <option value="placeholder">Please choose</option>
                <option value="Group">Group</option>
                <option value="Private">Private</option>
                <option value="Family">Family</option>
            </select><br><br>
            <input type="search" placeholder="People" id="people"></input><br><br>
            <div id="buttons">
                <button type="input" id="book" onclick="submitForm()">Book</button>
                <button type="input" id="reset">Reset</button>
            </div>
        </div>
        
    </form>


</body>
</html>
