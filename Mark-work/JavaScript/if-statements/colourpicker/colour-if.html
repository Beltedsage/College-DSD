<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Picker - if</title>
    <link rel="stylesheet" href="colours.css">
    <script src="colour-if-script.js" defer></script>
</head>
<body>
    <h1>Using an if Statement</h1>
    <label for="colour">Please choose a colour:</label>
    <select id="colour">
        <option value="">-- Choose --</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
        <option value="yellow">Yellow</option>
        <option value="pink">Pink</option>
    </select>
    <button type="button" id="btnGo">Go</button>

    <p id="display">Sample text</p>
</body>
</html>
